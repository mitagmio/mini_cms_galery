upstream sheyanova_api {
    server sheyanova_api:8080;
}

upstream sheyanova_admin {
    server sheyanova_admin:80;
}

# api.sheyanova.art only — public site (sheyanova.art / www) is on GitHub Pages
server {
    listen 80;
    server_name api.sheyanova.art;

    # shared-web (nginx-proxy) + docker bridge
    set_real_ip_from 192.167.0.0/16;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Let's Encrypt / ACME via nginx-proxy companion (pass-through)
    location /.well-known/acme-challenge/ {
        return 404;
    }

    location = /health {
        proxy_pass http://sheyanova_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
    }

    # Public + admin API
    location /api/ {
        proxy_pass http://sheyanova_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 120s;
        client_max_body_size 50m;
    }

    # Uploaded media
    location /media/ {
        proxy_pass http://sheyanova_api/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Static preview of generated site (draft → PREVIEW_DIR); served by API
    location /preview/ {
        proxy_pass http://sheyanova_api/preview/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # React admin SPA
    location /admin/ {
        proxy_pass http://sheyanova_admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        return 302 /admin/;
    }
}
